<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Mentor: Your Roadmap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: "Inter", sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(to bottom right, #e0f2fe, #ede9fe);
      color: #1f2937;
      min-height: 100vh;
    }

    .page-container {
      max-width: 1200px;
      margin: auto;
      padding: 2rem;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      background: #fff;
      border-radius: 1.5rem;
      box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.05);
      margin-bottom: 1rem;
    }

    .navbar-logo {
      font-size: 1.5rem;
      font-weight: 700;
      color: #8b5cf6;
    }

    .nav-links {
      display: flex;
      align-items: center;
    }

    .nav-links a {
      margin-left: 1.5rem;
      color: #4b5563;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.3s ease;
    }

    .nav-links a:hover {
      color: #8b5cf6;
    }

    .logout-btn {
      background-color: #8b5cf6;
      color: #fff;
      border: none;
      border-radius: 0.75rem;
      padding: 0.5rem 1rem;
      font-weight: 600;
      margin-left: 1.5rem;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .logout-btn:hover {
      background-color: #7c3aed;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(31, 41, 55, 0.6);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-box {
      background-color: #ffffff;
      border-radius: 1rem;
      padding: 2rem;
      width: 90%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 0.5rem 1.5rem rgba(0, 0, 0, 0.1);
    }

    .modal-buttons {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-top: 1.5rem;
    }

    .modal-btn {
      padding: 0.5rem 1.25rem;
      border: none;
      border-radius: 0.5rem;
      font-weight: 600;
      cursor: pointer;
    }

    .modal-btn.cancel {
      background-color: #e5e7eb;
      color: #374151;
    }

    .modal-btn.confirm {
      background-color: #8b5cf6;
      color: white;
    }

    .roadmap-nav {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1rem;
      padding: 0.75rem 1rem;
      background: #fff;
      border-radius: 1rem;
      box-shadow: 0 0.3rem 0.8rem rgba(0, 0, 0, 0.05);
      margin-bottom: 2rem;
    }

    .roadmap-nav button {
      background: #8b5cf6;
      border: none;
      color: #fff;
      padding: 0.5rem 1rem;
      border-radius: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .roadmap-nav button:hover {
      background: #6d28d9;
    }

    .roadmap-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .roadmap-header h1 {
      font-size: 3rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .roadmap-header p {
      font-size: 1.125rem;
      color: #6b7280;
    }

    .roadmap-timeline {
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .roadmap-card {
      background: #fff;
      border-radius: 1.5rem;
      box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.05);
      padding: 2rem;
      cursor: pointer;
      transition: box-shadow 0.3s ease;
    }

    .roadmap-card:hover {
      box-shadow: 0 0 15px rgba(139, 92, 246, 0.3);
    }

    .roadmap-card h3 {
      font-size: 1.5rem;
      font-weight: 600;
      color: #8b5cf6;
      margin-bottom: 0.5rem;
    }

    .roadmap-card p {
      font-size: 1rem;
      color: #6b7280;
      margin-bottom: 1rem;
    }

    .status-label {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      font-size: 0.875rem;
      font-weight: 600;
      border-radius: 0.5rem;
    }

    .status-completed {
      background: #d1fae5;
      color: #047857;
    }

    .status-inprogress {
      background: #fef3c7;
      color: #92400e;
    }

    .status-notstarted {
      background: #f3f4f6;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <div class="page-container">
    <nav class="navbar">
      <span class="navbar-logo">AI Mentor</span>
      <div class="nav-links">
        <a href="dashboard.html">Dashboard</a>
        <a href="roadmap.html" style="color: #8b5cf6;">Roadmap</a>
        <a href="resources.html">Resources</a>
        <a href="ai-mentor.html">AI Mentor</a>
        <button class="logout-btn" onclick="showLogoutModal()">Logout</button>
      </div>
    </nav>

    <div class="roadmap-nav">
      <button onclick="prevRoadmap()">← Prev</button>
      <span id="roadmap-title">Roadmap 1: Software Developer</span>
      <button onclick="nextRoadmap()">Next →</button>
    </div>

    <header class="roadmap-header">
      <h1>Your Learning Roadmap</h1>
      <p id="roadmap-desc"></p>
    </header>

    <main class="roadmap-timeline" id="roadmap-content"></main>
  </div>

  <div class="modal-overlay" id="logoutModal">
    <div class="modal-box">
      <h3>Are you sure you want to log out?</h3>
      <p style="color:#6b7280;">Your progress will be saved securely.</p>
      <div class="modal-buttons">
        <button class="modal-btn cancel" onclick="closeLogoutModal()">Cancel</button>
        <button class="modal-btn confirm" onclick="logout()">Logout</button>
      </div>
    </div>
  </div>

  <script>
    const roadmaps = [
      {
        id: 1,
        title: "Roadmap 1: Software Developer",
        desc: "Your personalized path to becoming a <b>Software Developer</b>.",
        phases: [
          { title: "Phase 1: Foundations", text: "Build core skills in programming and data structures.", href: "phase1-software.html" },
          { title: "Phase 2: Web Development Fundamentals", text: "Learn HTML, CSS, and JavaScript.", href: "phase2-software.html" },
          { title: "Phase 3: Front-End Frameworks", text: "Dive into React.js and front-end development.", href: "phase3-software.html" },
          { title: "Phase 4: Back-End Development", text: "Learn Node.js, Express, and databases.", href: "phase4-software.html" },
          { title: "Phase 5: Projects & Deployment", text: "Build full-stack projects and deploy on cloud.", href: "phase5-software.html" }
        ]
      },
      {
        id: 2,
        title: "Roadmap 2: Data Scientist",
        desc: "Your path to becoming a <b>Data Scientist</b>.",
        phases: [
          { title: "Phase 1: Statistics & Math", text: "Learn probability, linear algebra, and statistics.", href: "phase1-ds.html" },
          { title: "Phase 2: Python for Data Science", text: "Master NumPy, Pandas, and visualization libraries.", href: "phase2-ds.html" },
          { title: "Phase 3: Machine Learning", text: "Explore supervised and unsupervised algorithms.", href: "phase3-ds.html" },
          { title: "Phase 4: Deep Learning", text: "Implement neural networks and CNNs using TensorFlow/PyTorch.", href: "phase4-ds.html" },
          { title: "Phase 5: Real-World Projects", text: "Work on Kaggle datasets and deploy ML models.", href: "phase5-ds.html" }
        ]
      },
      {
        id: 3,
        title: "Roadmap 3: AI/ML Engineer",
        desc: "Your path to becoming an <b>AI/ML Engineer</b>.",
        phases: [
          { title: "Phase 1: Core AI Concepts", text: "Learn neural networks and backpropagation.", href: "phase1-aiml.html" },
          { title: "Phase 2: Deep Learning Frameworks", text: "Work with TensorFlow and PyTorch.", href: "phase2-aiml.html" },
          { title: "Phase 3: Advanced AI Systems", text: "Build NLP, CV, and RL models.", href: "phase3-aiml.html" },
          { title: "Phase 4: MLOps & Deployment", text: "Learn model serving and containerization.", href: "phase4-aiml.html" },
          { title: "Phase 5: Research & Innovation", text: "Experiment with cutting-edge AI projects.", href: "phase5-aiml.html" }
        ]
      }
    ];

    let currentIndex = 0;
    let userProgress = {}; // {roadmapId: {phaseNumber: status}}

    function showLogoutModal() {
      document.getElementById("logoutModal").style.display = "flex";
    }

    function closeLogoutModal() {
      document.getElementById("logoutModal").style.display = "none";
    }

    function logout() {
      localStorage.removeItem("userName");
      localStorage.removeItem("token");
      window.location.href = "login.html";
    }

    function prevRoadmap() {
      currentIndex = (currentIndex - 1 + roadmaps.length) % roadmaps.length;
      loadRoadmap(currentIndex);
    }

    function nextRoadmap() {
      currentIndex = (currentIndex + 1) % roadmaps.length;
      loadRoadmap(currentIndex);
    }

    function getStatus(roadmapId, phaseNum) {
      return userProgress[roadmapId]?.[phaseNum] || "NOT_STARTED";
    }

    function getStatusLabel(status) {
      const labels = {
        "COMPLETED": '<span class="status-label status-completed">Completed ✓</span>',
        "IN_PROGRESS": '<span class="status-label status-inprogress">In Progress</span>',
        "NOT_STARTED": '<span class="status-label status-notstarted">Not Started</span>'
      };
      return labels[status] || labels["NOT_STARTED"];
    }

    async function startPhase(roadmapId, phaseNum, phaseHref) {
      const token = localStorage.getItem("token");
      if (!token) {
        alert("Please log in to track progress");
        return;
      }

      const currentStatus = getStatus(roadmapId, phaseNum);
      if (currentStatus === "COMPLETED") {
        window.location.href = phaseHref;
        return;
      }

      const confirmStart = confirm("Start this phase?");
      if (!confirmStart) return;

      try {
        const response = await fetch(`http://localhost:8081/api/roadmap/start/${roadmapId}/${phaseNum}`, {
          method: "POST",
          headers: { "Authorization": `Bearer ${token}` }
        });

        if (!response.ok) throw new Error("Failed to start phase");

        // Update local state
        if (!userProgress[roadmapId]) userProgress[roadmapId] = {};
        userProgress[roadmapId][phaseNum] = "IN_PROGRESS";

        loadRoadmap(currentIndex);
        setTimeout(() => {
          window.location.href = phaseHref;
        }, 200);

      } catch (error) {
        console.error("Error starting phase:", error);
        alert("Failed to update progress. Please try again.");
      }
    }

    function loadRoadmap(index) {
      const roadmap = roadmaps[index];
      document.getElementById("roadmap-title").innerHTML = roadmap.title;
      document.getElementById("roadmap-desc").innerHTML = roadmap.desc;

      const content = document.getElementById("roadmap-content");
      content.innerHTML = "";

      roadmap.phases.forEach((phase, i) => {
        const phaseNum = i + 1;
        const status = getStatus(roadmap.id, phaseNum);

        const card = document.createElement("div");
        card.className = "roadmap-card";
        card.onclick = () => startPhase(roadmap.id, phaseNum, phase.href);

        card.innerHTML = `
          <h3>${phase.title}</h3>
          <p>${phase.text}</p>
          ${getStatusLabel(status)}
        `;

        content.appendChild(card);
      });
    }

    // Load user progress on page load
    document.addEventListener("DOMContentLoaded", async () => {
      const token = localStorage.getItem("token");
      if (!token) {
        loadRoadmap(currentIndex);
        return;
      }

      try {
        const response = await fetch("http://localhost:8081/api/roadmap/progress", {
          headers: { "Authorization": `Bearer ${token}` }
        });

        if (response.ok) {
          userProgress = await response.json();
          console.log("✅ Loaded roadmap progress:", userProgress);
        }
      } catch (error) {
        console.error("Error loading progress:", error);
      }

      loadRoadmap(currentIndex);
    });
  </script>
</body>
</html>
