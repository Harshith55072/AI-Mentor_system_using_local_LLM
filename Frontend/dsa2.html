<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Part 2: Linked Lists & Stacks/Queues</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(to bottom right, #e0f2fe, #ede9fe);
      color: #1f2937;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem;
    }

    .header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .header h1 {
      font-size: 2rem;
      font-weight: 700;
    }

    .video-section {
      background: #ffffff;
      padding: 1.5rem;
      border-radius: 1.5rem;
      box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.05);
      margin-bottom: 2rem;
      border: 1px solid #e5e7eb;
    }

    .video-title {
      font-weight: 600;
      margin-bottom: 1rem;
    }

    iframe {
      width: 100%;
      height: 315px;
      border: none;
      border-radius: 0.75rem;
    }

    .complete-btn {
      display: block;
      width: 100%;
      background-color: #10b981;
      color: white;
      border: none;
      padding: 1rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 0.75rem;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .complete-btn:hover {
      background-color: #059669;
    }

    .complete-btn:disabled {
      background-color: #9ca3af;
      cursor: not-allowed;
    }

    .completed-message {
      margin-top: 1rem;
      text-align: center;
      color: #10b981;
      font-weight: 600;
      display: none;
    }

    .back-btn {
      display: inline-block;
      margin-bottom: 1rem;
      color: #8b5cf6;
      text-decoration: none;
      font-weight: 600;
    }

    .back-btn:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="dsa.html" class="back-btn">← Back to DSA</a>

    <header class="header">
      <h1>Part 2: Linked Lists & Stacks/Queues</h1>
      <p>Learn the essential building blocks of efficient data processing and memory management.</p>
    </header>

    <section class="video-section">
      <div class="video-title">1. Singly & Doubly Linked Lists</div>
      <iframe src="https://www.youtube.com/embed/sWgDk-o-6ZE" allowfullscreen></iframe>
    </section>

    <section class="video-section">
      <div class="video-title">2. Stack Data Structure</div>
      <iframe src="https://www.youtube.com/embed/zwb3GmNAtFk" allowfullscreen></iframe>
    </section>

    <section class="video-section">
      <div class="video-title">3. Queue Data Structure</div>
      <iframe src="https://www.youtube.com/embed/K5vK5tffHuw" allowfullscreen></iframe>
    </section>

    <section class="video-section">
      <div class="video-title">4. Practice Problems</div>
      <iframe src="https://www.youtube.com/embed/-DzowlcaUmE" allowfullscreen></iframe>
    </section>

    <button class="complete-btn" id="completeBtn" onclick="markComplete()">✔ Mark as Complete</button>
    <div class="completed-message" id="completedMessage">✅ Marked as Complete!</div>
  </div>

  <script>
    const PART_NUMBER = 2; // Update for this DSA section

    async function markComplete() {
      const token = localStorage.getItem('token');
      if (!token) {
        alert('Please log in to track your progress');
        return;
      }

      const btn = document.getElementById('completeBtn');
      btn.disabled = true;
      btn.textContent = 'Saving...';

      try {
        const response = await fetch(`http://localhost:8081/api/progress/complete/${PART_NUMBER}`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (!response.ok) throw new Error('Failed to save progress');

        const progress = await response.json();
        console.log('✅ Progress saved:', progress);

        document.getElementById('completedMessage').style.display = 'block';
        btn.textContent = '✔ Completed';
        
        // Optional redirect after 2 seconds
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 2000);

      } catch (error) {
        console.error('Error saving progress:', error);
        alert('Failed to save progress. Please try again.');
        btn.disabled = false;
        btn.textContent = '✔ Mark as Complete';
      }
    }

    // Check progress on load
    document.addEventListener('DOMContentLoaded', async () => {
      const token = localStorage.getItem('token');
      if (!token) return;

      try {
        const response = await fetch('http://localhost:8081/api/progress', {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (!response.ok) return;

        const progress = await response.json();
        const isComplete = progress[`part${PART_NUMBER}Complete`];

        if (isComplete) {
          document.getElementById('completedMessage').style.display = 'block';
          const btn = document.getElementById('completeBtn');
          btn.textContent = '✔ Completed';
          btn.disabled = true;
        }
      } catch (error) {
        console.error('Error checking progress:', error);
      }
    });
  </script>
</body>
</html>
